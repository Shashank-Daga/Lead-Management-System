# Local development database only.
# For production, point DATABASE_URL at a managed Postgres instance instead
# (Supabase, RDS, Railway, Neon, etc.) — this compose file is not deployed.
version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: lms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_password
      POSTGRES_DB: lms_db
    ports:
      - "5432:5432"
    volumes:
      - lms_postgres_data:/var/lib/postgresql/data

volumes:
  lms_postgres_data:
